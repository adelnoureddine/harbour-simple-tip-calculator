<?xml version="1.0" encoding="UTF-8"?>
<!--
  Simple Tip Calculator, launcher icon. Drawn on a 172 px grid, the largest size the app
  ships; the PNGs in icons/ are this file rendered at 86, 108, 128 and 172 px.
  A coloured ring with the letters T, I and P around a coin marked with a per cent sign.
  (The version 0.2 icon had the BMI calculator's stethoscope in the middle.)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="172" height="172" viewBox="0 0 172 172">
  <defs>
    <clipPath id="ring">
      <circle cx="86" cy="86" r="73"/>
    </clipPath>
  </defs>
  <circle cx="86" cy="86" r="84" fill="#e4e4e4"/>
  <!-- The ring: blue at the top, green on the right, red on the left. -->
  <g stroke="#ffffff" stroke-width="2" clip-path="url(#ring)">
    <path d="M86 86 L14.9 14.9 A100.5 100.5 0 0 1 157.1 14.9 Z" fill="#1f6fd1"/>
    <path d="M86 86 L157.1 14.9 A100.5 100.5 0 0 1 86 186.5 Z" fill="#27a844"/>
    <path d="M86 86 L86 186.5 A100.5 100.5 0 0 1 14.9 14.9 Z" fill="#c62f2f"/>
  </g>
  <circle cx="86" cy="86" r="84" fill="none" stroke="#bdbdbd" stroke-width="2"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="30"
     fill="#ffffff" text-anchor="middle" dominant-baseline="central">
    <text x="31" y="87">T</text>
    <text x="86" y="32">I</text>
    <text x="141" y="87">P</text>
  </g>
  <!-- The coin. -->
  <circle cx="86" cy="86" r="35" fill="#f4b62a" stroke="#ffffff" stroke-width="4"/>
  <circle cx="86" cy="86" r="26" fill="none" stroke="#d88f12" stroke-width="3"/>
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <path d="M98 72 L74 100"/>
    <circle cx="75.5" cy="74.5" r="5.5" stroke-width="4"/>
    <circle cx="96.5" cy="97.5" r="5.5" stroke-width="4"/>
  </g>
</svg>
